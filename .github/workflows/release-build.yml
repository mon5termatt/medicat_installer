# Build x64 + Win32 installers and attach them to a GitHub Release.
#
# Trigger: push a semver tag that matches the installer version (no "v" prefix):
#   git tag 1.0.50
#   git push origin 1.0.50
#
# Version is pinned to that tag. CI never bumps from GitHub or local +1.
#
# The tagged commit must include this workflow file.
#
# Optional repo secret:
#   MEDICAT_INGEST_TOKEN  - baked into the exe for telemetry / support ingest.
#                           Empty is allowed (support upload will be disabled).
#
# Discord notify: release-webhook.yml is called after upload. A GITHUB_TOKEN
# release create does not emit release: published, so the webhook job must
# be invoked from this workflow (workflow_call). Manual publishes still use
# release: published. Do not also create the release with a PAT, or Discord
# would get both the event and this job.

name: Release build

on:
  push:
    tags:
      - "1.0.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version to pin (1.0.N, no v prefix)"
        required: true
        type: string
      publish:
        description: "Create or update the GitHub Release and upload assets"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
      MEDICAT_PIN_BUILD: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
      MEDICAT_BUILD_NUMBER_BUMPED: "1"
      MEDICAT_INGEST_TOKEN: ${{ secrets.MEDICAT_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pillow

      - name: Check installer version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Need a semver like 1.0.50 with no v prefix (got: ${VERSION:-empty})"
            exit 1
          fi
          echo "Building installer version ${VERSION}"

      - name: Generate i18n
        run: python tools/i18n_codegen.py

      - name: Pin version to tag
        run: python tools/bump_build_number.py build_number.txt generated/build_version.cpp --major 1 --minor 0 --set ${{ env.VERSION }}

      - name: Configure CMake
        run: cmake -S cmake/unified -B build -G "Visual Studio 17 2022"

      - name: Build Release (x64 + Win32)
        run: cmake --build build --config Release --target MedicatInstallerAll

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MedicatInstaller-${{ env.VERSION }}
          path: |
            build/Release/MedicatInstaller.exe
            build/Release/MedicatInstaller-x86.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools\upload_release.bat %VERSION%

  notify:
    name: Discord webhook
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    uses: ./.github/workflows/release-webhook.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
    secrets: inherit
